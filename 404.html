<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex">
  <title>not here / duk.</title>
  <link rel="icon" type="image/png" href="/assets/memes/pfp.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css?v=5a29f187">
</head>
<body>
  <header class="site-header page-width">
    <div class="site-header-top"><a class="wordmark" href="/" aria-label="duk home">duk.</a><span class="ticker">$DUK</span></div>
  </header>
  <main id="main" class="page-width section-space">
    <p class="eyebrow">404</p>
    <h1 style="font-size:clamp(34px,6vw,80px);letter-spacing:-2px;line-height:1.1">this page isn't here.<br><strong>he ducked anyway.</strong></h1>
    <img src="/assets/ducking.png" alt="duk flat on the floor, wings over his head, staring at you" width="1000" height="600" style="display:block;width:min(560px,100%);height:auto;margin:40px 0">
    <p data-moved hidden></p>
    <p><a class="button" href="/">go home</a> <a class="button" href="/memes.html">the memes</a> <a class="button" href="/maker.html">make a duk</a></p>
    <script>
      // A share link (s/<folder>-<file>.html) whose piece left the site: point at the page that piece lived on.
      (() => {
        const name = (location.pathname.match(/^\/s\/([\w-]+?)(?:\.html)?$/) || [])[1];
        if (!name) return;
        const homes = [[/^(clips2|videos-clips)-/, '/watch.html', 'the clips'], [/^(gifs2|gifs)-/, '/stickers.html#gifs', 'the reaction gifs'],
          [/^(comics2?)-/, '/comics.html', 'the comics'], [/^daily-/, '/daily.html', 'duk of the day'], [/^fame-/, '/fame.html', 'the wall of fame'], [/./, '/memes.html', 'the memes']];
        const [, href, label] = homes.find(([test]) => test.test(name));
        const note = document.querySelector('[data-moved]');
        const link = document.createElement('a');
        link.href = href;
        link.textContent = label;
        note.append('that one got taken down. the rest are in ', link, '.');
        note.hidden = false;
      })();
    </script>
  </main>
</body>
</html>
